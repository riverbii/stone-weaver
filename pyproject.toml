[project]
name = "stone-weaver"
version = "0.1.0"
description = "Agentic narrative engine for reconstructing Dream of the Red Chamber"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["stone_weaver"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
